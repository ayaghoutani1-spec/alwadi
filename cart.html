<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الوادي - سلة المشتريات</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #11141a;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* حاوية الصفحة الكبيرة المحاكية للهاتف */
        .cart-container {
            width: 100%;
            max-width: 400px;
            background-color: #0b111e;
            border-radius: 30px;
            border: 3px solid #c5a059;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .page-title {
            color: #c5a059;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 10px;
        }

        /* تصميم ورقة الفاتورة المنسقة في منتصف الشاشة */
        .invoice-paper {
            background-color: #ffffff;
            color: #333333;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            margin-bottom: 25px;
            background-image: linear-gradient(#f4f4f4 1px, transparent 1px);
            background-size: 100% 25px;
            line-height: 25px;
        }

        /* إعطاء مظهر الورقة المشرشرة من الأسفل */
        .invoice-paper::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -10px;
            width: 100%;
            height: 10px;
            background: linear-gradient(-45deg, #0b111e 5px, transparent 0), linear-gradient(45deg, #0b111e 5px, transparent 0);
            background-size: 10px 10px;
        }

        .invoice-header {
            text-align: center;
            font-weight: 700;
            border-bottom: 2px dashed #888888;
            padding-bottom: 8px;
            margin-bottom: 12px;
            color: #11141a;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .invoice-table th {
            border-bottom: 1px solid #333;
            text-align: right;
            padding: 4px 0;
        }

        .invoice-table td {
            padding: 6px 0;
            border-bottom: 1px dotted #ccc;
        }

        .total-row {
            font-weight: 700;
            font-size: 16px;
            border-top: 2px dashed #333;
            padding-top: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* تصميم استمارات إدخال بيانات الزبون */
        .user-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            color: #e2e8f0;
            font-size: 14px;
        }

        .form-group input {
            background-color: #11141a;
            border: 1px solid rgba(197, 160, 89, 0.5);
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #c5a059;
        }

        /* أزرار التحكم والإرسال */
        .btn-submit {
            background-color: #c5a059;
            color: #0b111e;
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2);
        }

        .btn-submit:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-back {
            text-align: center;
            margin-top: 15px;
        }

        .btn-back a {
            color: #a0aec0;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="cart-container">
        <h1 class="page-title">سلة المشتريات الفاتورة</h1>

        <!-- ورقة الفاتورة المنسقة التي تظهر بمنتصف الشاشة فوق الفورم -->
        <div class="invoice-paper">
            <div class="invoice-header">مركز الوادي - تفاصيل الطلب</div>
            <table class="invoice-table">
                <thead>
                    <tr>
                        <th>الصنف</th>
                        <th style="text-align: center;">الكمية</th>
                        <th style="text-align: left;">النوع</th>
                    </tr>
                </thead>
                <tbody id="cart-table-body">
                    <!-- سيتم التوليد التلقائي هنا -->
                </tbody>
            </table>
            <div class="total-row">
                <span>إجمالي الأصناف:</span>
                <span id="cart-total-qty">0 طرود</span>
            </div>
        </div>

        <!-- 🛠️ التعديل الجذري: تحويل الحقول إلى فورم رسمي يتوجه مباشرة للواتساب الصحيح -->
        <form action="https://wa.me" method="GET" target="_blank" class="user-form" id="orderForm"
            onsubmit="return buildWadiMessageBeforeSend(event)">

            <!-- حقل مخفي لتحديد رقم مركز الوادي المستلم للفاتورة بشكل إجباري ومباشر -->
            <input type="hidden" name="phone" value="963931668374">

            <!-- حقل مخفي يتم تعبئته بنص الفاتورة تلقائياً قبل الإرسال -->
            <input type="hidden" name="text" id="whatsapp-text-input">

            <div class="form-group">
                <label for="username">اسم العميل (المحل):</label>
                <input type="text" id="username" class="wadi-name" placeholder="أدخل اسمك أو اسم المحل" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف للاتصال:</label>
                <input type="tel" id="phone" class="wadi-phone" placeholder="مثال: 0992351754" required>
            </div>

            <div class="form-group">
                <label for="location">عنوان المحل أو الموقع:</label>
                <input type="text" id="location" class="wadi-loc" placeholder="مثال: السويداء - حي الأمل" required>
            </div>

            

            <!-- خانة اختيار الموزع -->
        <div class="form-group" style="margin: 20px 0; font-family: Arial, sans-serif; direction: rtl;">
           <label for="distributor-select" style="display:block; margin-bottom:8px; font-weight:bold; color: #333;">اختر الموزع (اختياري):</label>
           <select id="distributor-select" style="padding: 10px; width: 100%; max-width: 350px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px;">
             <option value="">-- لم يتم اختيار موزع --</option>
             <option value="مركز الوادي">مركز الوادي</option>
             <option value="انس حرب">انس حرب</option>
             <option value="معتز عامر">معتز عامر</option>
             <option value="عمر الغوطاني">عمر الغوطاني</option>
             <option value="سلطان زين الدين">سلطان زين الدين</option>
             <option value="بهاء جودية">بهاء جودية</option>
             <option value="عاصم الحلبي">عاصم الحلبي</option>
             <option value="مازن الحسين">مازن الحسين</option>
             <option value="ايمن ابو حسون">ايمن ابو حسون</option>
             <option value="حسين الغوطاني">حسين الغوطاني</option>
             <option value="نائل الغوطاني">نائل الغوطاني</option>
             <option value="حلدون زهر الدين">خلدون زهر الدين</option>
             <option value="محمود قريشة">محمود قريشة</option>
        </select>
      </div>



            <!-- زر إرسال حقيقي للفورم يستحيل حظره أو تعطيله -->
            <button type="submit" class="btn-submit"
                style="display: block; width: 100%; text-align: center; border: none; cursor: pointer; height: 40px; line-height: 40px; background-color: #ecc07d; color: #11141a; font-weight: bold; border-radius: 5px; font-size: 15px; box-sizing: border-box; padding: 0;">
                تأكيد وإرسال عبر الواتساب
            </button>
        </form>

        <!-- زر العودة لصفحة المنتجات الأصلي تحت الفورم -->
        <div class="btn-back" style="margin-top: 20px; text-align: center;">
            <a href="products.html" style="color: #ecc07d; text-decoration: none; font-size: 14px;">← العودة لصفحة
                المنتجات</a>
        </div>

        <!-- كود الجافا سكريبت النظيف جداً بدون توليد روابط معقدة -->
       <script>
    document.addEventListener('DOMContentLoaded', () => {
        function updateLiveInvoiceDirectly() {
            const tableBody = document.getElementById("cart-table-body");
            const totalElement = document.getElementById("cart-total-qty");

            if (!tableBody) return;

            let grandTotalTarad = 0;
            let grandTotalKees = 0;
            let grandTotalOlab = 0;
            let grandTotalQusaiPieces = 0;
            let grandTotalNormalTarad = 0;
            
            tableBody.innerHTML = "";

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);

                // الفحص يعتمد الآن على بداية المفتاح (Key) للتصنيف الدقيق والآمن
                if (key && key.startsWith('qty-') && !key.endsWith('_name')) {
                    let qty = parseInt(localStorage.getItem(key)) || 0;
                    let arabicName = localStorage.getItem(key + '_name') || "صنف غير معرف";

                    if (qty > 0) {
                        let unitText = "";
                        
                        // 1. فحص قسم موالح معن
                        if (key.startsWith('qty-mwalih')) {
                            let tarad = Math.floor(qty / 12);
                            let kees = qty % 12;
                            
                            if (tarad > 0 && kees > 0) {
                                unitText = tarad + " طرد و " + kees + " كيس";
                            } else if (tarad > 0) {
                                unitText = tarad + " طرد";
                            } else {
                                unitText = kees + " كيس";
                            }
                            
                            grandTotalTarad += tarad;
                            grandTotalKees += kees;
                        } 
                        // 2. فحص قسم بسكويت تورن
                        else if (key.startsWith('qty-toren')) {
                            let tarad = Math.floor(qty / 6);
                            let olba = qty % 6;
                            
                            if (tarad > 0 && olba > 0) {
                                unitText = tarad + " طرد و " + olba + " علبة";
                            } else if (tarad > 0) {
                                unitText = tarad + " طرد";
                            } else {
                                unitText = olba + " علبة";
                            }
                            
                            grandTotalTarad += tarad;
                            grandTotalOlab += olba;
                        } 
                        // 3. فحص قسم قصي فوود
                        else if (key.startsWith('qty-qousai')) {
                            unitText = qty + " قطعة";
                            grandTotalQusaiPieces += qty;
                        } 
                        // 4. خيار احتياطي لأي مفتاح قديم أو مختلف
                        else {
                            unitText = qty + " طرد";
                            grandTotalNormalTarad += qty;
                        }

                        let row = "<tr>" +
                            "<td>" + arabicName + "</td>" +
                            "<td style='text-align: center;'>" + qty + "</td>" +
                            "<td style='text-align: left; font-weight: bold; color: #2e7d32;'>" + unitText + "</td>" +
                            "</tr>";
                        tableBody.innerHTML += row;
                    }
                }
            }

            // تجميع الكسور المتبقية وتحويلها لطرود إضافية مقربة للأعلى في الإجمالي النهائي لشحن مركز الوادي
            let extraMawalihTarad = Math.ceil(grandTotalKees / 12);
            let extraOlabTarad = Math.ceil(grandTotalOlab / 6);
            let finalTotalTarad = grandTotalTarad + extraMawalihTarad + extraOlabTarad + grandTotalNormalTarad;

            if (grandTotalTarad === 0 && grandTotalKees === 0 && grandTotalOlab === 0 && grandTotalQusaiPieces === 0 && grandTotalNormalTarad === 0) {
                tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#888; padding: 20px 0;'>السلة فارغة، يرجى العودة واختيار أصناف.</td></tr>";
            }

            // تحديث نص الإجمالي بأسفل صفحة السلة
            if (totalElement) {
                let summaryText = "";
                if (finalTotalTarad > 0) summaryText += finalTotalTarad + " طرود ";
                if (grandTotalQusaiPieces > 0) summaryText += (finalTotalTarad > 0 ? " و " : "") + grandTotalQusaiPieces + " قطعة قصي فوود";
                if (summaryText === "") summaryText = "0 طرود";
                
                totalElement.innerText = summaryText;
            }
        }

        updateLiveInvoiceDirectly();
    });

    // ====================================================
    // ميزة التصفير التلقائي للسلة عند مغادرة أو إغلاق الصفحة
    // ====================================================
    window.addEventListener('pagehide', () => {
        localStorage.clear();
    });
    window.addEventListener('unload', () => {
        localStorage.clear();
    });

    // دالة تجهيز نص الفاتورة وإرسالها المباشر لمركز الوادي عبر الواتساب
    function buildWadiMessageBeforeSend(event) {
        event.preventDefault();

        var nameVal = document.getElementById('username') ? document.getElementById('username').value.trim() : "";
        var phoneVal = document.getElementById('phone') ? document.getElementById('phone').value.trim() : "";
        var locVal = document.getElementById('location') ? document.getElementById('location').value.trim() : "";
        var distributorVal = document.getElementById('distributor-select') ? document.getElementById('distributor-select').value.trim() : "";

        if (nameVal === "" || phoneVal === "" || locVal === "") {
            alert("يرجى ملء جميع البيانات أولاً!");
            return false;
        }

        var messageText = "طلب شراء جديد - مركز الوادي\n";
        messageText += "الاسم: " + nameVal + "\n";
        messageText += "رقم الهاتف: " + phoneVal + "\n";
        messageText += "العنوان: " + locVal + "\n";
        
        if (distributorVal !== "") {
            messageText += "الموزع المختار: " + distributorVal + "\n";
        } else {
            messageText += "الموزع المختار: لم يتم اختيار موزع (طلب مباشر)\n";
        }
        messageText += "----------------------------\n";
        messageText += "تفاصيل الطلبية:\n\n";

        var hasItems = false;
        var grandTotalTarad = 0;
        var grandTotalKees = 0;
        var grandTotalOlab = 0;
        var grandTotalQusaiPieces = 0;
        var grandTotalNormalTarad = 0;

        for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && key.startsWith('qty-') && !key.endsWith('_name')) {
                var qty = parseInt(localStorage.getItem(key)) || 0;
                var arabicName = localStorage.getItem(key + '_name') || "صنف غير معرف";

                if (qty > 0) {
                    hasItems = true;
                    var unitText = "";

                    if (key.startsWith('qty-mwalih')) {
                        var tarad = Math.floor(qty / 12);
                        var kees = qty % 12;
                        if (tarad > 0 && kees > 0) unitText = tarad + " طرد و " + kees + " كيس";
                        else if (tarad > 0) unitText = tarad + " طرد";
                        else unitText = kees + " كيس";
                        
                        grandTotalTarad += tarad;
                        grandTotalKees += kees;
                    } else if (key.startsWith('qty-toren')) {
                        var tarad = Math.floor(qty / 6);
                        var olba = qty % 6;
                        if (tarad > 0 && olba > 0) unitText = tarad + " طرد و " + olba + " علبة";
                        else if (tarad > 0) unitText = tarad + " طرد";
                        else unitText = olba + " علبة";
                        
                        grandTotalTarad += tarad;
                        grandTotalOlab += olba;
                    } else if (key.startsWith('qty-qousai')) {
                        unitText = qty + " قطعة";
                        grandTotalQusaiPieces += qty;
                    } else {
                        unitText = qty + " طرد";
                        grandTotalNormalTarad += qty;
                    }

                    messageText += "- " + arabicName + ": " + qty + " وحدة (" + unitText + ")\n";
                }
            }
        }

        var extraMawalihTarad = Math.ceil(grandTotalKees / 12);
        var extraOlabTarad = Math.ceil(grandTotalOlab / 6);
        var finalTotalTarad = grandTotalTarad + extraMawalihTarad + extraOlabTarad + grandTotalNormalTarad;

        messageText += "\n----------------------------\n";
        messageText += "خلاصة التعبئة والشحن الإجمالية:\n";
        if (finalTotalTarad > 0) messageText += "- إجمالي الشحن: " + finalTotalTarad + " طرود\n";
        if (grandTotalQusaiPieces > 0) messageText += "- إجمالي قصي فوود: " + grandTotalQusaiPieces + " قطعة\n";

        if (!hasItems) {
            alert("سلة المشتريات فارغة!");
            return false;
        }

        var wadiCompanyPhone = "963992351754"; 
        var encodedText = encodeURIComponent(messageText);
        var whatsappAppUrl = "whatsapp://send?phone=" + wadiCompanyPhone + "&text=" + encodedText;
        var whatsappWebUrl = "https://wa.me" + wadiCompanyPhone + "?text=" + encodedText;
        
        localStorage.clear(); 

        try {
            window.location.href = whatsappAppUrl;
        } catch (e) {
            window.location.href = whatsappWebUrl;
        }

        return true;
    }
</script>


</html>
